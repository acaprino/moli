[package]
name = "shinatama-moli-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Shinatama's private host for Moli: the protocol router on a token-checked named pipe."

[[bin]]
name = "shinatama-moli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", default-features = false }
clap = { version = "4.5.39", features = ["derive", "env"] }
moli = { path = "../moli", default-features = false }
moli-core = { path = "../moli-core" }
moli-protocol-server = { path = "../moli-protocol-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.51.0", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }

[lints]
workspace = true
